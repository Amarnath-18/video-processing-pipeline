services:
  auth-service:
    environment:
      ASPNETCORE_URLS: http://+:8080;https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/auth-service.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${AUTH_SERVICE_CERT_PASSWORD}
    ports:
      - "${AUTH_SERVICE_HTTPS_PORT:-7044}:8443"
    volumes:
      - ${HTTPS_CERTS_PATH}:/https:ro

  video-service:
    environment:
      ASPNETCORE_URLS: http://+:8080;https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/video-service.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${VIDEO_SERVICE_CERT_PASSWORD}
    ports:
      - "${VIDEO_SERVICE_HTTPS_PORT:-7026}:8443"
    volumes:
      - ${HTTPS_CERTS_PATH}:/https:ro
